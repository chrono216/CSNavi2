<ons-page id="settings-page">
    <ons-toolbar>
        <div class="left"><ons-back-button>戻る</ons-back-button></div>
        <div class="center">設定</div>
        <div class="right">
            <ons-toolbar-button class="btn-goto-top">
                <ons-icon icon="md-home"></ons-icon> TOP
            </ons-toolbar-button>
        </div>
    </ons-toolbar>

    <ons-list>
        <ons-list-header>表示モード</ons-list-header>
        <ons-list-item>
            <div class="center">
                タブレットモード (独自キーボード)
            </div>
            <div class="right">
                <ons-switch id="switch-tablet-mode"></ons-switch>
            </div>
        </ons-list-item>
        <ons-list-item secondary style="font-size: 11px; color: #8e8e93; min-height: 20px; line-height: 1.2;">
            OFFにするとスマホのキーボードを使用します。
        </ons-list-item>
        
        <ons-list-item>
            <div class="center">
                Liteモード (非対応曲を隠す)
            </div>
            <div class="right">
                <ons-switch id="switch-lite-mode"></ons-switch>
            </div>
        </ons-list-item>
        <ons-list-item secondary style="font-size: 11px; color: #8e8e93; min-height: 20px; line-height: 1.2;">
            ONにするとLite版で選曲できない楽曲を非表示にします。
        </ons-list-item>

        <ons-list-header>通信設定</ons-list-header>
        <ons-list-item modifier="chevron" tappable id="btn-network-settings">
            <div class="left"><ons-icon icon="md-settings" style="color: #4cd964;"></ons-icon></div>
            <div class="center">通信設定 (IP・ポート)</div>
        </ons-list-item>

        <ons-list-header>データ管理</ons-list-header>
        <ons-list-item modifier="chevron" tappable id="btn-force-update">
            <div class="left"><ons-icon icon="fa-download" style="color: #007aff;"></ons-icon></div>
            <div class="center">差分ファイル強制再受信</div>
        </ons-list-item>
        <ons-list-item modifier="chevron" tappable id="btn-error-log">
            <div class="left"><ons-icon icon="fa-exclamation-triangle" style="color: #ff3b30;"></ons-icon></div>
            <div class="center">エラー曲ログを確認</div>
        </ons-list-item>
        <ons-list-item modifier="chevron" tappable id="btn-clear-history">
            <div class="left"><ons-icon icon="md-delete" style="color: #ff3b30;"></ons-icon></div>
            <div class="center">予約履歴をクリア</div>
        </ons-list-item>
    </ons-list>

    <!-- バージョン情報表示エリア -->
    <div
        style="text-align: center; color: #8e8e93; font-size: 11px; margin-top: 24px; padding-bottom: 24px; line-height: 1.6;">
        <span id="btn-release-note"
            style="color: var(--primary-color); text-decoration: underline; cursor: pointer; font-size: 13px;">NaviVersion
            <span id="version-display">2.0.2</span></span> <!-- ←ここにバージョン番号 -->
        <br>
        Developed by Chrono,Miriel
    </div>

</ons-page>
