<ons-page id="settings-page">
    <ons-toolbar>
        <div class="left"><ons-back-button>戻る</ons-back-button></div>
        <div class="center">設定</div>
        <div class="right">
            <ons-toolbar-button class="btn-goto-top">
                <ons-icon icon="md-home"></ons-icon> TOP
            </ons-toolbar-button>
        </div>
    </ons-toolbar>

    <ons-list>
        <ons-list-header>表示モード</ons-list-header>
        <ons-list-item>
            <div class="center">
                タブレットモード (独自キーボード)
            </div>
            <div class="right">
                <ons-switch id="switch-tablet-mode"></ons-switch>
            </div>
        </ons-list-item>
        <ons-list-item secondary>
            OFFにするとスマホのキーボードを使用します。
        </ons-list-item>

        <ons-list-header>通信設定</ons-list-header>
        <ons-list-item>
            <div class="left">IPアドレス</div>
            <div class="center">
                <ons-input id="input-server-ip" type="text" modifier="transparent"></ons-input>
            </div>
        </ons-list-item>
        <ons-list-item>
            <div class="left">ポート</div>
            <div class="center">
                <ons-input id="input-server-port" type="number" modifier="transparent"></ons-input>
            </div>
        </ons-list-item>

        <ons-list-item>
            <ons-button modifier="large" id="btn-save-settings" style="margin: 16px 0;">設定を保存</ons-button>
        </ons-list-item>
    </ons-list>

    <!-- バージョン情報表示エリア -->
    <div
        style="text-align: center; color: #8e8e93; font-size: 11px; margin-top: 24px; padding-bottom: 24px; line-height: 1.6;">
        <span id="btn-release-note"
            style="color: var(--primary-color); text-decoration: underline; cursor: pointer; font-size: 13px;">NaviVersion
            2.0.1</span> <!-- ←ここにバージョン番号 -->
        <br>
        Developed by Chrono,Miriel
    </div>

    <style>
        #input-server-ip,
        #input-server-port {
            width: 100%;
            text-align: right;
        }
    </style>
</ons-page>
